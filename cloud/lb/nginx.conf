# Load balancer (version minimale) : pour l'instant il relaie tout vers UNE seule "production".
#
# TODO (responsable cloud applicatif, P4) :
#   - plusieurs serveurs dans le bloc upstream (en docker compose, le nom "production"
#     résout vers toutes les répliques ; sur de vraies VMs, Ansible écrira leurs IP ici) ;
#   - prouver la répartition (en-tête X-Served-By qui alterne) et la tolérance à la panne
#     (on coupe une VM, le site continue de répondre).
upstream production {
    server production:8000;
}

server {
    listen 80;
    client_max_body_size 2g;          # les vidéos peuvent être grosses

    location / {
        proxy_pass http://production;
    }
}
